user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 25m; # document/selfie uploads (PRD §10.13/§10.26)

  # Reverse proxy for KITalent. TLS termination + routing to api/web/minio.
  upstream kitalent_api { server api:4000; }
  upstream kitalent_web { server web:3000; }
  upstream kitalent_minio { server minio:9000; }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://kitalent_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Preserve Accept-Language for backend localization (PRD §10.34 #9).
      proxy_set_header Accept-Language $http_accept_language;
    }

    location /storage/ {
      proxy_pass http://kitalent_minio/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://kitalent_web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
