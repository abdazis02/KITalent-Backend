name: kitalent_app
description: KITalent — employee self-service & supervisor mobile app.
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing (PRD §11.1)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Branding & iconography
  flutter_svg: ^2.0.10+1
  phosphor_flutter: ^2.1.0

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Localization (PRD §10.34) — id-ID / en-US
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Attendance & device (PRD §10.13)
  geolocator: ^13.0.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  local_auth: ^2.3.0

  # Notifications (PRD §10.28)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  image: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/logo/

# App launcher icon — the logo mark only (no wordmark), per brand guidance.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon.png"
